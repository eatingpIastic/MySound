<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍏 Intelligent Soundboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <h1 class="apple-glow">Intelligent Soundboard</h1>
    <p>Inspired by Apple Intelligence</p>
  </header>

  <section class="upload-section">
    <label class="custom-upload">
      📁 Upload MP3/WAV Files
      <input type="file" id="fileInput" accept=".mp3,.wav" multiple />
    </label>
    <p class="hint">Upload as many as you want — each file becomes a button!</p>
  </section>

  <main id="soundboard" class="soundboard">
    <!-- Dynamically created sound buttons appear here -->
  </main>

  <footer>
    <p>🍏 Made with intelligence. Yours.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
