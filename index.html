<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 Soundboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="hero">
    <h1 class="glow">Intelligent Soundboard</h1>
    <p class="subtitle">Import your own sounds</p>
  </div>

  <div class="upload-area">
    <label for="fileInput" class="upload-label">📁 Upload MP3/WAV files</label>
    <input type="file" id="fileInput" accept=".mp3,.wav" multiple />
  </div>

  <div class="soundboard" id="soundboard">
    <!-- Buttons for sounds will be created dynamically -->
  </div>

  <footer>
    <p>Made by You 🍏</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
